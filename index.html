<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mystical Rabbit Tarot</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#14162e;
  --bg2:#0b0e1f;
  --gold:#f6d37a;
  --gold-dim:rgba(246, 211, 122, 0.2);
  --panel:#161a33;
  --table:#3a2a1e;
  --cardBackImg: url('https://i.imgur.com/0XeqElI.png');
  --mainBgImg: url('https://imgur.com/H9Ho0uc.png');
  --good:#66e0a3;
  --bad:#ff6b81;
  --neutral:#9aa4ff;
  --loa-bg: rgba(60, 70, 100, 0.5); 
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans KR", sans-serif;
  background:radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
  overflow-x:hidden;
  color:white;
  min-height: 100vh;
  width: 100vw;
}

/* ===== STARS BACKGROUND ===== */
.star-container {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
}
.star{
  position:absolute;
  width:2px;height:2px;border-radius:50%;
  background:white;
  opacity:0;
  animation:fadeStar var(--duration) infinite ease-in-out;
  box-shadow: 0 0 4px var(--gold);
}
@keyframes fadeStar{
  0%{opacity:0; transform: scale(0.5);}
  50%{opacity:1; transform: scale(1.2);}
  100%{opacity:0; transform: scale(0.5);}
}

/* ===== LANDING ===== */
.landing{
  position: fixed;
  inset: 0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index: 10;
  transition: opacity 0.5s ease;
  background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
}

.landing-scene {
    position: relative;
    width: 100%;
    height: 100%; 
    background-image: var(--mainBgImg);
    background-size: cover; 
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
}

.center-card-overlay {
    position: absolute;
    top: 43%; 
    left: 48%; 
    width: 25%; 
    height: 40%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #3e2b1f; 
    z-index: 2;
    cursor: pointer;
    transform-style: preserve-3d;
    transform: 
        translate(-50%, -50%) 
        rotateZ(-23.5deg)     
        rotateX(20deg)      
        rotateY(10deg)      
        scale(0.95);
    mix-blend-mode: multiply;
    opacity: 0.95;
}

.center-card-overlay::before {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
    z-index: -1;
    border-radius: 50%;
    animation: pulseAura 3s infinite ease-in-out;
    mix-blend-mode: screen; 
    pointer-events: none;
}

@keyframes pulseAura {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 0.8; transform: scale(1.15); }
}

.landing-title {
    font-family: 'Gowun Batang', serif;
    font-size: clamp(24px, 5vw, 48px);
    font-weight: 700;
    color: #2a1f15; 
    margin-bottom: 25px; 
    text-shadow: 1px 1px 0px rgba(255,255,255,0.2); 
    word-break: keep-all;
    line-height: 1.1;
    letter-spacing: -0.05em;
    backface-visibility: hidden;
}

.start-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(14px, 2.5vw, 18px);
    font-weight: 800;
    background: transparent;
    border: 3px solid #2a1f15;
    color: #2a1f15;
    padding: 10px 28px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    backface-visibility: hidden;
    margin-left: 25px; 
}

.start-btn:hover {
    background: #2a1f15;
    color: #f0e6d2;
    transform: scale(1.05) translateZ(5px);
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}

/* ===== TABLE PAGE ===== */
.deckPage{
  display:none;
  position:absolute;inset:0;
  background-color: #252237;
  background-image: url('https://i.imgur.com/mtWInTD.png');
  background-repeat: no-repeat;
  background-position: center top;
  background-size: cover; 
  background-attachment: fixed;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 5;
  overflow-y: auto; 
  overflow-x: hidden;
  padding-bottom: 100px;
}
.deckPage.active { opacity: 1; }

.layout{
  display:flex;
  min-height:100vh; 
  flex-direction: column; 
  align-items: center;
}

.table-area{
  width: 100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start; 
  position:relative;
  min-height: 100vh; 
  transition: min-height 0.5s ease;
  perspective: 1000px;
  padding-top: 50px;
}

.scalable-wrapper {
    position: relative;
    width: 900px; 
    height: 600px; 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform-origin: center top; 
    transition: all 0.5s ease;
}

.deck-title-msg{
  font-size:24px;
  font-weight:900;
  color:var(--gold);
  letter-spacing:1px;
  text-shadow: 0 4px 12px rgba(0,0,0,0.8);
  margin-bottom: 20px;
  min-height: 36px;
  transition: all 0.3s ease;
  z-index: 500;
}

.deck-container{
  position:relative;
  width:900px;
  height:500px; 
}

/* 3D CARD - 크기 축소 (130x210) */
.deck-card{
  position:absolute;
  width:130px; height:210px;
  perspective:1000px;
  cursor: pointer;
  transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
  -webkit-tap-highlight-color: transparent;
  transform-origin: center center;
}
.deck-card.dim{
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.5s ease;
}
.deck-card.disabled{pointer-events:none}

.card-inner{
  width:100%;height:100%;
  position:absolute;
  transform-style:preserve-3d;
  transition:transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  border-radius:12px;
}
.deck-card.flipped .card-inner{ transform:rotateY(180deg); }

.card-face{
  position:absolute;
  inset:0;
  border-radius:12px;
  backface-visibility:hidden;
  display:flex; flex-direction: column;
  align-items:center;justify-content:center;
  overflow:hidden;
  background-color: transparent; 
}

.card-back{
  background-image: var(--cardBackImg);
  background-size: 100% 100%; 
  background-position: center;
}

.card-front{
  background-color: transparent;
  background-size: 100% 100%; 
  background-repeat: no-repeat;
  background-position: center;
  transform:rotateY(180deg);
}

.deck-card.glow .card-front::after{
  content:"";
  position:absolute;
  inset:-20px;
  background: radial-gradient(circle at 50% 50%, rgba(246,211,122,.7), transparent 60%);
  opacity:0;
  animation:glowPulseCard .8s ease-out forwards;
  pointer-events:none;
  z-index: -1;
}

.deck-card.selected{ z-index: 400 !important; }

/* ===== RESULT AREA ===== */
.result-container {
    width: 95%;
    max-width: 1200px;
    margin-top: 40px;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
    animation: slideUp 0.8s ease-out forwards;
    flex-direction: column;
    align-items: center;
}

.result-header-msg {
    font-size: 28px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(246, 211, 122, 0.5);
    margin-bottom: 40px;
    text-align: center;
    width: 100%;
}

.result-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    width: 100%;
    margin-bottom: 40px;
}

.result-column {
    flex: 1;
    min-width: 300px;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(16, 20, 40, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
}
.result-column:hover {
    transform: translateY(-5px);
    background: rgba(16, 20, 40, 0.8);
    border-color: var(--gold-dim);
}

.result-card-visual {
    width: 160px; /* 결과 카드도 비율 맞춰 축소 */
    height: 250px;
    background-size: 100% 100%;
    background-position: center;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    margin-bottom: 20px;
}

.position-badge {
    background: var(--gold);
    color: #1a1222;
    font-size: 14px;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 900;
    margin-bottom: 10px;
    display: inline-block;
    box-shadow: 0 4px 10px rgba(246, 211, 122, 0.3);
}

.card-name-title {
    color: white;
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 5px;
    text-align: center;
}

.reading-meaning {
    color: var(--good);
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 15px;
    text-align: center;
    opacity: 0.9;
}

.reading-detail {
    font-size: 15px; 
    color: #ddd; 
    line-height: 1.6; 
    background: rgba(0,0,0,0.3); 
    padding: 15px; 
    border-radius: 12px; 
    width: 100%;
    text-align: left; 
    word-break: keep-all;
}

/* 로아 조언 스타일 */
.loa-advice-box {
    margin-top: 15px;
    font-size: 15px;
    color: #e0e6ff;
    line-height: 1.6;
    background: var(--loa-bg);
    border: 1px solid rgba(150, 180, 255, 0.2);
    padding: 15px;
    border-radius: 12px;
    width: 100%;
    text-align: left; 
    word-break: keep-all;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
}
.loa-title {
    font-weight: 900;
    color: #aaccff;
    margin-bottom: 5px;
    display: block;
}

.bottom-section {
    width: 100%;
    max-width: 800px;
    background: rgba(16, 20, 40, 0.85);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    margin-top: 20px;
    backdrop-filter: blur(10px);
}

.result-section-title {
    color: var(--gold);
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
    text-align: center;
}

.fortuneItem{display:flex;gap:15px;margin-top:14px;align-items:center; font-size: 15px;}
.bar-label { width: 70px; font-weight: bold; color: #ccc; }
.bar{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;transition:width 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 6px;}

.controls-area {
    display: flex;
    margin-top: 30px;
    gap: 20px;
    justify-content: center;
}

.btn{
  padding:14px 34px;
  border-radius:50px;
  border:none;
  background:var(--gold);
  color: #1a1222;
  font-weight:800;
  font-size: 18px;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(0,0,0,.3);
  transition: transform 0.2s, background 0.2s;
}
.btn:hover { background: #ffe4a0; transform: scale(1.05); }
.btn.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2); backdrop-filter: blur(4px);}
.btn.secondary:hover { background: rgba(255,255,255,0.2); }

@keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@media (max-width: 900px) {
    /* 모바일에서는 높이 줄여줌 */
    .scalable-wrapper { width: 100%; height: 450px; }
    .deck-container { width: 100%; height: 400px; }
    /* 모바일에서 카드 크기 조정 */
    .deck-card { width: 90px; height: 140px; } 
    .deck-title-msg { font-size: 20px; margin-bottom: 10px; }
    
    /* 모바일 랜딩 화면 조정 */
    .center-card-overlay { 
        width: 55%; 
        height: 45%; 
        left: 48%; 
    }
    .landing-title { font-size: 28px; margin-bottom: 20px; }
    .start-btn { padding: 12px 24px; font-size: 16px; margin-left: 20px; }

    /* 모바일 결과 화면 */
    .result-column { 
        min-width: 100%; 
        max-width: 100%; 
    } 
    .result-card-visual { width: 120px; height: 180px; }
}
</style>
</head>
<body>

<div class="star-container" id="starContainer"></div>

<!-- Landing Screen -->
<div class="landing" id="landing">
  <div class="landing-scene">
      <div class="center-card-overlay" onclick="startSpread()">
          <div class="landing-title">황금토끼<br>타로</div>
          <button class="start-btn">카드 뽑기</button>
      </div>
  </div>
</div>

<!-- Main Deck Page -->
<div class="deckPage" id="deckPage">
  <div class="layout">
    
    <!-- Top Area -->
    <div class="table-area" id="tableArea">
        <div class="scalable-wrapper" id="scalableWrapper">
            <div class="deck-title-msg" id="pickMsg">✨ 3장의 카드를 뽑아주세요 ✨</div>
            <div class="deck-container" id="deckContainer"></div>
        </div>
    </div>

    <!-- Result Area -->
    <div class="result-container" id="resultContainer">
        <div class="result-header-msg">✨ 결과가 나왔습니다! ✨</div>
        <div class="result-grid" id="resultGrid"></div>

        <div class="bottom-section">
            <div class="result-section-title">📊 운세 스탯 분석</div>
            <div id="fortuneList"></div>
            <div id="totalScore" style="margin-top:25px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1); font-weight:900; color:var(--gold); font-size:18px; text-align:center;"></div>
            
            <div class="controls-area">
                <button class="btn" onclick="resetReading()">다시 하기</button>
                <button class="btn secondary" onclick="goToHome()">홈으로</button>
            </div>
        </div>
    </div>

  </div>
</div>

<script>
/* ===== INIT STARS ===== */
const starContainer = document.getElementById('starContainer');
for(let i=0;i<80;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.top=Math.random()*100+'%';
  s.style.left=Math.random()*100+'%';
  s.style.setProperty('--duration', (Math.random()*3+2)+'s');
  s.style.animationDelay=Math.random()*5+'s';
  starContainer.appendChild(s);
}

/* ===== CONSTANTS & DATA ===== */
const POSITIONS=["과거", "현재", "조언"];
const SCORE_LABELS = {
    overall: "총운",
    enhance: "강화운",
    drop: "득템운",
    party: "파티운"
};

const tarotData=[
  {

    loa: '오늘은 계산보다 감각을 믿어도 괜찮습니다. 미뤄두었던 강화나 도전 컨텐츠를 가볍게 한 번 시도해보세요. 큰 결심이 아니라 “한 번 더”라는 여유가 의외의 성과를 부를 수 있습니다.',
    revMeaning:'무모한 행동과 현실 도피',
    revDetail:'준비 없는 시작은 위험합니다. 지금의 자유분방함은 무책임함으로 비칠 수 있습니다. 발밑을 확인하지 않고 걷다가는 낭떠러지로 떨어질 수 있습니다.',
    revLoa: '충동은 잠시 내려두는 것이 좋겠습니다. 현재 상황을 다시 확인하고, 급하게 누르려던 버튼은 하루만 미뤄보세요. 오늘은 준비가 결과를 좌우합니다.',
    score:{overall:7,enhance:8,drop:5,party:4}, revScore:{overall:3,enhance:2,drop:2,party:2}
  },
  {

    detail:'당신은 이미 목표를 달성할 모든 도구를 갖추고 있습니다. 아이디어를 현실로 만드는 능력이 발휘될 때입니다. 주저하지 말고 능력을 펼치세요.',

    revMeaning:'재능의 낭비와 속임수',
    revDetail:'뛰어난 능력을 엉뚱한 곳에 쓰거나 집중하지 못하고 있습니다. 겉모습만 화려하고 실속이 없거나, 잔꾀를 부리다가 신뢰를 잃을 수 있습니다.',

  {

    loa: '오늘은 시도보다 관찰이 어울립니다. 무리한 강화보다는 준비와 정리에 집중해보세요. 다음 기회를 더 날카롭게 맞이할 수 있습니다.',
    revMeaning:'드러난 비밀과 감정의 기복',
    revDetail:'숨겨왔던 비밀이 드러나거나 예민해진 감정 때문에 판단력이 흐려질 수 있습니다. 감정적으로 행동하기보다는 이성적으로 상황을 바라보세요.',
    revLoa: '감정에 흔들릴 수 있는 날입니다. 분위기나 채팅에 과민하게 반응하지 마세요. 조용히 플레이하면 불필요한 소모를 줄일 수 있습니다.',
    score:{overall:7,enhance:7,drop:5,party:3}, revScore:{overall:4,enhance:3,drop:3,party:2}
  },
  {
    name:'여황제 (The Empress)', img:'https://i.imgur.com/25KMRXh.png',

    loa: '판단이 흐려질 수 있습니다. 큰 결정보다는 안전한 플레이가 어울립니다.',

    revLoa: '혼란이 정리되는 흐름입니다. 미뤄둔 트라이나 재시도가 의외로 순조롭게 풀릴 수 있습니다.',
    score:{overall:4,enhance:3,drop:4,party:3}, revScore:{overall:6,enhance:5,drop:6,party:6}

  {

    revMeaning:'일시적인 흐림과 지연',
    revDetail:'성공이 눈앞에 보이지만 조금 지연되거나, 사소한 문제로 기쁨이 반감될 수 있습니다. 하지만 태양은 사라지지 않았으니 조금만 기다리세요.',

  },

    revMeaning:'과거에 대한 후회',
    revDetail:'과거의 실수나 미련에 발목이 잡혀 앞으로 나아가지 못하고 있습니다. 변명은 그만두고 자신의 잘못을 인정해야 새 출발을 할 수 있습니다.',
    revLoa: '후회가 판단을 흐릴 수 있습니다. 오늘은 복기와 정리가 우선입니다.',

  },
  {
    name:'세계 (The World)', img:'https://i.imgur.com/CFKWk25.png',
    meaning:'완벽한 완성과 통합',
    detail:'긴 여정이 성공적으로 마무리되고 완벽한 조화를 이룹니다. 목표를 완전히 달성하여 최고의 성취감을 느낄 것입니다. 해피엔딩입니다.',
    loa: '마무리하기 좋은 날입니다. 장기 목표의 마지막 단계를 차분히 시도하세요.',
    revMeaning:'미완성의 아쉬움',
    revDetail:'목표에 거의 도달했지만 결정적인 한 조각이 부족합니다. 99%까지 왔지만 마지막 1%의 부족함 때문에 답답함을 느낄 수 있습니다.',
    revLoa: '거의 완성 단계입니다. 조급하지 않게 마지막 한 걸음을 정리하는 것이 중요합니다.',
    score:{overall:10,enhance:10,drop:10,party:10}, revScore:{overall:6,enhance:6,drop:6,party:6}

/* ===== STATE ===== */
let selected=[]; 
let isAnimating = false;

/* ===== FUNCTIONS ===== */

function handleResize() {
    const wrapper = document.getElementById('scalableWrapper');
    const tableArea = document.getElementById('tableArea');
    if(!wrapper || !tableArea) return;

    // 모바일에서는 스케일링 기준 너비를 줄여서 카드가 크게 보이게 함
    const isMobile = window.innerWidth <= 900;
    const baseWidth = isMobile ? 600 : 900; 
    const baseHeight = 500;
    const availableWidth = tableArea.clientWidth;
    const availableHeight = tableArea.clientHeight;

    const scaleX = (availableWidth * 0.95) / baseWidth;
    const scaleY = (availableHeight * 0.75) / baseHeight;
    
    let scale = Math.min(scaleX, scaleY);
    if(scale > 1.2) scale = 1.2;

    wrapper.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', handleResize);


function startSpread(){
  // 시작 시 스크롤 최상단으로
  window.scrollTo(0, 0);
  
  document.getElementById('landing').style.opacity = '0';
  setTimeout(()=>{
      document.getElementById('landing').style.display = 'none';
      document.getElementById('deckPage').style.display = 'block';
      setTimeout(() => document.getElementById('deckPage').classList.add('active'), 50);
      handleResize(); 
      animateSpread();
  }, 500);
}

function goToHome() {
    document.getElementById('deckPage').classList.remove('active');
    setTimeout(() => {
        document.getElementById('deckPage').style.display = 'none';
        document.getElementById('landing').style.display = 'flex';
        setTimeout(()=> document.getElementById('landing').style.opacity = '1', 50);
    }, 500);
}

function animateSpread(){
  const container = document.getElementById('deckContainer');
  container.innerHTML='';
  selected=[];
  isAnimating = true;

  // UI 초기화
  document.getElementById('pickMsg').textContent = '✨ 3장의 카드를 뽑아주세요 ✨';
  document.getElementById('resultGrid').innerHTML='';
  document.getElementById('fortuneList').innerHTML='';
  document.getElementById('totalScore').textContent='';
  
  // 테이블 영역 다시 표시
  document.getElementById('tableArea').style.display = 'flex';
  document.getElementById('resultContainer').style.display = 'none';
  document.getElementById('resultContainer').style.opacity = '0';
  
  // 스크롤 상단 이동
  window.scrollTo(0, 0);

  // Shuffle
  for (let i = tarotData.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tarotData[i], tarotData[j]] = [tarotData[j], tarotData[i]];
  }

  // 부채꼴 세팅
  const totalCards = tarotData.length;
  const angleRange = 70; 
  const startAngle = -angleRange / 2;
  const angleStep = angleRange / (totalCards - 1);
  const radius = 600; 
  const centerX = 450; 
  const centerY = 800; 

  tarotData.forEach((data, i) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'deck-card';
    
    // 초기 위치
    wrapper.style.left = (centerX - 65) + 'px'; // 130/2
    wrapper.style.top = (centerY - radius - 140) + 'px'; 
    wrapper.style.transform = `rotate(0deg)`;
    wrapper.style.zIndex = i; 

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    front.style.backgroundImage = `url('${data.img}')`;

    inner.appendChild(back);
    inner.appendChild(front);
    wrapper.appendChild(inner);
    container.appendChild(wrapper);

    // 펼쳐지는 애니메이션
    setTimeout(() => {
        const angleDeg = startAngle + (i * angleStep);
        const angleRad = (angleDeg - 90) * (Math.PI / 180); 

        const targetX = centerX + radius * Math.cos(angleRad) - 65; 
        const targetY = centerY + radius * Math.sin(angleRad) - 230; 

        wrapper.style.left = targetX + 'px';
        wrapper.style.top = targetY + 'px';
        wrapper.style.transform = `rotate(${angleDeg}deg)`;
        
        wrapper.dataset.baseTransform = `rotate(${angleDeg}deg)`;
        wrapper.dataset.baseZIndex = i;

        if(i === totalCards - 1) isAnimating = false;
    }, i * 40 + 100);

    wrapper.onmouseenter = () => {
        if (!wrapper.classList.contains('dim') && !wrapper.classList.contains('selected') && !isAnimating) {
            wrapper.style.transform = `${wrapper.dataset.baseTransform} translateY(-40px) scale(1.1)`;
        }
    };
    wrapper.onmouseleave = () => {
        if (!wrapper.classList.contains('dim') && !wrapper.classList.contains('selected') && !isAnimating) {
            wrapper.style.transform = wrapper.dataset.baseTransform;
        }
    };

    wrapper.onclick=()=>selectCard(wrapper, data);
  });
}

function resetReading(){
  if(isAnimating) return;
  animateSpread();
}

function selectCard(el, data){
  if(isAnimating || selected.length >= 3) return;
  if(el.classList.contains('selected') || el.classList.contains('disabled')) return;

  const reversed = Math.random() < 0.3;

  el.classList.add('selected');
  el.classList.add('glow');
  el.style.zIndex = 600 + selected.length; 

  const front = el.querySelector('.card-front');
  if(reversed){
    front.style.transform = 'rotateY(180deg) rotate(180deg)';
  } else {
    front.style.transform = 'rotateY(180deg)';
  }
  
  el.onmouseenter = null;
  el.onmouseleave = null;

  requestAnimationFrame(()=> el.classList.add('flipped'));
  setTimeout(()=> el.classList.remove('glow'), 1000);

  selected.push({ data, reversed, el });

  const remaining = 3 - selected.length;
  const msgEl = document.getElementById('pickMsg');
  
  if (remaining > 0) {
      msgEl.textContent = `✨ ${remaining}장 더 뽑아주세요 ✨`;
  } else {
      msgEl.textContent = '✨ 운명을 해석하는 중... ✨';
      isAnimating = true; 
      setTimeout(placeSpread, 800);
  }
}

function placeSpread(){
  const container = document.getElementById('deckContainer');
  const all = Array.from(container.querySelectorAll('.deck-card'));

  // 선택 안 된 카드 사라지게
  all.forEach(card=>{
    if(!card.classList.contains('selected')){
      card.style.opacity = '0';
    }
  });

  // 선택된 카드들 정렬 애니메이션
  const cardW = 130; // 변경된 카드 너비
  const gap = 80;
  const totalW = (cardW * 3) + (gap * 2);
  const startX = (900 - totalW) / 2;
  const targetY = 100; 
  
  selected.forEach((item, idx)=>{
    const targetX = startX + idx * (cardW + gap);
    
    item.el.style.transition = 'all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
    item.el.style.left = targetX + 'px';
    item.el.style.top = targetY + 'px';
    item.el.style.transform = `rotate(0deg) scale(1.1)`; 
    item.el.style.zIndex = 700 + idx;
  });

  // 애니메이션 끝나고 결과 화면 렌더링
  setTimeout(()=>{
    document.getElementById('pickMsg').textContent = '✨ 결과가 나왔습니다! ✨';
    
    // 테이블 영역 숨기고 결과 화면 표시
    document.getElementById('tableArea').style.display = 'none';

    renderResultView();
    
    // 결과 영역 표시 및 스크롤 상단으로 이동
    const resultContainer = document.getElementById('resultContainer');
    resultContainer.style.display = 'flex';
    
    // 스크롤을 맨 위로 강제 이동 (결과 상단부터 보이게)
    window.scrollTo(0, 0); 
    
    setTimeout(()=> {
        resultContainer.style.opacity = '1';
    }, 50);

    isAnimating = false;
  }, 1000);
}

function renderResultView(){
  const grid = document.getElementById('resultGrid');
  grid.innerHTML = '';

  selected.forEach((item, i) => {
    const isRev = item.reversed;
    const dirStr = isRev ? '(역방향)' : '(정방향)';
    const meaning = isRev ? item.data.revMeaning : item.data.meaning;
    const detail  = isRev ? item.data.revDetail  : item.data.detail;
    // 로아 조언
    const loaAdvice = isRev ? (item.data.revLoa || item.data.loa) : item.data.loa;
    
    // 역방향이면 이미지 180도 회전 CSS 필요
    const imgTransform = isRev ? 'transform: rotate(180deg);' : '';

    const col = document.createElement('div');
    col.className = 'result-column';
    col.innerHTML = `
        <div class="position-badge">${POSITIONS[i]}</div>
        <div class="result-card-visual" style="background-image: url('${item.data.img}'); ${imgTransform}"></div>
        <div class="card-name-title">${item.data.name}</div>
        <div style="font-size:14px; color:#aaa; margin-bottom:10px;">${dirStr}</div>
        <div class="reading-meaning">${meaning}</div>
        <div class="reading-detail">${detail}</div>
        <div class="loa-advice-box">
            <span class="loa-title">🎮 로아 조언</span>
            ${loaAdvice}
        </div>
    `;
    grid.appendChild(col);
  });

  calculateTotal();
}

function calculateTotal(){
  const sums = { overall:0, enhance:0, drop:0, party:0 };

  selected.forEach(item => {
    const s = (item.reversed && item.data.revScore) ? item.data.revScore : item.data.score;
    for (let k in sums) {
        sums[k] += s[k];
    }
  });

  const avgs = {};
  for (let k in sums) {
      avgs[k] = Math.round(sums[k] / 3); 
  }

  const fortuneList = document.getElementById('fortuneList');
  fortuneList.innerHTML = '';

  for (let k in avgs) {
    const val = avgs[k];
    let color = 'var(--neutral)';
    if(val >= 8) color = 'var(--good)';
    else if(val <= 4) color = 'var(--bad)';

    const row = document.createElement('div');
    row.className = 'fortuneItem';
    row.innerHTML = `
      <div class="bar-label">${SCORE_LABELS[k]}</div>
      <div class="bar">
        <div class="fill" style="width:0%; background:${color};"></div>
      </div>
      <div style="width:30px; text-align:right; font-weight:bold; color:${color}">${val}</div>
    `;
    fortuneList.appendChild(row);

    setTimeout(() => {
        row.querySelector('.fill').style.width = (val * 10) + '%';
    }, 100);
  }

  const totalAvg = Math.round((sums.overall + sums.enhance + sums.drop + sums.party) / 12); 
  document.getElementById('totalScore').innerHTML = `종합 운세 지수 <span style="font-size:1.4em; color:white; margin-left:10px;">${totalAvg}</span> / 10`;
}

window.onload = handleResize;

</script>
